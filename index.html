<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO Club Monitoring Dashboard | Uttar Pradesh</title>
<meta name="description" content="ECO Club Monitoring Dashboard | Uttar Pradesh. Notification upload and plantation drive status, district-wise.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .stat-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px; margin: 28px 0 30px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .stat .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 10px; }
  .stat .stat-num { font-family: Calibri, Candara, sans-serif; font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
  .stat .stat-of { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat.accent .stat-num { color: var(--accent-ink); }
  .stat.warn .stat-num { color: var(--warn); }

  .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin: 10px 0 36px; }
  .report-btn {
    display: flex; align-items: center; gap: 22px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 26px; text-decoration: none; color: var(--ink);
    box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease;
  }
  .report-btn:hover { border-color: var(--accent); transform: translateY(-3px); }
  .report-btn .ring-wrap { position: relative; flex-shrink: 0; width: 112px; height: 112px; }
  .report-btn .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .report-btn .ring-pct { font-family: Calibri, Candara, sans-serif; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .report-btn .ring-pct-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .report-btn .body { flex: 1; min-width: 0; }
  .report-btn .card-eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--accent); font-weight: 700; }
  .report-btn h2 { font-size: 22px; margin: 4px 0 8px; }
  .report-btn .legend-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .report-btn .legend-row .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .report-btn .legend-row .dot.done { background: var(--accent); }
  .report-btn .legend-row .dot.pending { background: var(--warn); }
  .report-btn .legend-row b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .report-btn .cta { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--accent-ink); }

  .hero { text-align: center; padding: 8px 0 6px; }
  .hero h1 { font-size: clamp(28px, 4.5vw, 42px); }
  .hero .dek { margin: 0 auto; }

  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px; margin-bottom: 40px; }
  .chart-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow); }
  .chart-card h3 { font-family: Calibri, Candara, sans-serif; font-size: 16px; margin: 0 0 4px; }
  .chart-card .chart-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 16px; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 46px; align-items: center; gap: 10px; padding: 6px 0; }
  .bar-row .bar-label { font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track2 { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; }
  .bar-fill2 { height: 100%; border-radius: 5px; }
  .bar-row .bar-val { font-size: 13px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="topnav">
  <div class="inner">
    <a class="brand" href="index.html"><span class="leaf">&#127807;</span> ECO Club | Uttar Pradesh</a>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="notification.html">Notification</a>
      <a href="plantation.html">Plantation</a>
    </nav>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <p class="eyebrow">Government of Uttar Pradesh</p>
    <h1>ECO Club Monitoring Dashboard</h1>
    <p class="dek">Notification uploads and the plantation drive, tracked school by school across every district.</p>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="report-grid" id="reportGrid"></div>

  <div class="chart-grid" id="chartGrid"></div>
</div>

<script src="assets/site.js"></script>
<script>
function ring(id, pct, colorVar) {
  const r = 46, c = 2 * Math.PI * r;
  const off = c * (1 - pct / 100);
  return `
    <svg width="112" height="112" viewBox="0 0 112 112" role="img" aria-label="${pct}% complete">
      <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--track)" stroke-width="12"/>
      <circle cx="56" cy="56" r="${r}" fill="none" stroke="${colorVar}" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
        transform="rotate(-90 56 56)"/>
    </svg>`;
}

function barList(rows, valueKey, colorVar, max) {
  return rows.map(r => `
    <div class="bar-row">
      <div class="bar-label">${titleCase(r.district)}</div>
      <div class="bar-track2"><div class="bar-fill2" style="width:${Math.max(4, r[valueKey] / max * 100)}%;background:${colorVar}"></div></div>
      <div class="bar-val">${fmt(r[valueKey])}</div>
    </div>`).join('');
}

(async function () {
  const s = await loadJSON('data/summary.json');
  const n = s.notification, p = s.plantation;

  document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="stat-label">Government Schools</div><div class="stat-num">${fmt(n.govtTotal)}</div></div>
    <div class="stat"><div class="stat-label">Aided Schools</div><div class="stat-num">${fmt(n.aidedTotal)}</div></div>
    <div class="stat"><div class="stat-label">Private Schools Tracked</div><div class="stat-num">${fmt(n.privTotal)}</div></div>
    <div class="stat accent"><div class="stat-label">Notification Uploaded</div><div class="stat-num">${fmt(n.uploaded)}</div><div class="stat-of">of ${fmt(n.totalSchools)} schools</div></div>
    <div class="stat accent"><div class="stat-label">Plantation Done</div><div class="stat-num">${fmt(p.done)}</div><div class="stat-of">of ${fmt(p.totalSchools)} schools</div></div>
    <div class="stat accent"><div class="stat-label">Trees Planted</div><div class="stat-num">${fmt(p.treesPlanted)}</div></div>
  `;

  const notifPct = Math.round(n.uploaded / n.totalSchools * 100);
  const plantPct = Math.round(p.done / p.totalSchools * 100);

  document.getElementById('reportGrid').innerHTML = `
    <a class="report-btn" href="notification.html">
      <div class="ring-wrap">
        ${ring('notif', notifPct, 'var(--accent)')}
        <div class="ring-center"><span class="ring-pct">${notifPct}%</span><span class="ring-pct-label">Uploaded</span></div>
      </div>
      <div class="body">
        <span class="card-eyebrow">Report</span>
        <h2>Notification Report</h2>
        <div class="legend-row">
          <span><span class="dot done"></span>Uploaded <b>${fmt(n.uploaded)}</b></span>
          <span><span class="dot pending"></span>Pending <b>${fmt(n.pending)}</b></span>
        </div>
        <div class="legend-row">
          <span>Govt <b>${fmt(n.govtDone)}/${fmt(n.govtTotal)}</b></span>
          <span>Aided <b>${fmt(n.aidedDone)}/${fmt(n.aidedTotal)}</b></span>
          <span>Private <b>${fmt(n.privDone)}/${fmt(n.privTotal)}</b></span>
        </div>
        <div class="cta">View school-level report &rarr;</div>
      </div>
    </a>
    <a class="report-btn" href="plantation.html">
      <div class="ring-wrap">
        ${ring('plant', plantPct, 'var(--accent)')}
        <div class="ring-center"><span class="ring-pct">${plantPct}%</span><span class="ring-pct-label">Done</span></div>
      </div>
      <div class="body">
        <span class="card-eyebrow">Report</span>
        <h2>Plantation Report</h2>
        <div class="legend-row">
          <span><span class="dot done"></span>Done <b>${fmt(p.done)}</b></span>
          <span><span class="dot pending"></span>Pending <b>${fmt(p.pending)}</b></span>
        </div>
        <div class="legend-row">
          <span>Govt <b>${fmt(p.govtDone)}/${fmt(p.govtTotal)}</b></span>
          <span>Aided <b>${fmt(p.aidedDone)}/${fmt(p.aidedTotal)}</b></span>
          <span>Trees <b>${fmt(p.treesPlanted)}</b></span>
        </div>
        <div class="cta">View school-level report &rarr;</div>
      </div>
    </a>
  `;

  const topTrees = [...p.byDistrict].sort((a, b) => b.treesPlanted - a.treesPlanted).slice(0, 8);
  const topPending = [...n.byDistrict]
    .map(d => ({ district: d.district, pending: (d.govtTotal + d.aidedTotal + d.privTotal) - (d.govtDone + d.aidedDone + d.privDone) }))
    .sort((a, b) => b.pending - a.pending).slice(0, 8);
  const maxTrees = Math.max(...topTrees.map(d => d.treesPlanted));
  const maxPending = Math.max(...topPending.map(d => d.pending));

  document.getElementById('chartGrid').innerHTML = `
    <div class="chart-card">
      <h3>Top Districts | Trees Planted</h3>
      <div class="chart-sub">Government + Aided schools, plantation drive</div>
      ${barList(topTrees, 'treesPlanted', 'var(--accent)', maxTrees)}
    </div>
    <div class="chart-card">
      <h3>Top Districts | Notification Pending</h3>
      <div class="chart-sub">Govt + Aided + Private schools yet to upload</div>
      ${barList(topPending, 'pending', 'var(--warn)', maxPending)}
    </div>
  `;
})();
</script>
</body>
</html>
